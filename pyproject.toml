[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srt-adapter"
version = "1.0.0"
description = "Semiotic-Reflexive Transformer — lightweight adapter for semiotic awareness on any frozen causal LM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Burton Lancaster" }]
keywords = ["nlp", "transformers", "adapter", "semiotics", "interpretability", "qwen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6",
    # transformers 4.x and 5.x are both supported (the dtype/torch_dtype
    # kwarg rename is handled at the call site). The earlier <5.0 pin was
    # written against an early 5.x where KV-cached manual generation
    # degenerated; re-verified working on 5.14 (Qwen2.5-7B: verbalize,
    # cached steer/introspect streams all coherent). Prefer >=5.5: it
    # patches the loader RCEs CVE-2026-4372 + CVE-2026-5241. If you stay
    # on 4.x, never pass untrusted Hub IDs to from_pretrained().
    "transformers>=4.40,<6.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]
eval = ["mteb>=1.12", "datasets>=2.14", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/space-bacon/SRT"
Repository = "https://github.com/space-bacon/SRT"
Models = "https://huggingface.co/RiverRider"
Demo = "https://huggingface.co/spaces/RiverRider/srt-adapter-v1.0-demo"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["."]
include = ["srt*", "srt_introspect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download or instantiate real (tiny) HF models",
]
