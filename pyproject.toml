[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srt-adapter"
version = "1.0.0"
description = "Semiotic-Reflexive Transformer — lightweight adapter for semiotic awareness on any frozen causal LM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Burton Lancaster" }]
keywords = ["nlp", "transformers", "adapter", "semiotics", "interpretability", "qwen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6",
    # transformers 4.x and 5.x are both supported via two call-site shims:
    # (1) the dtype/torch_dtype from_pretrained kwarg rename, and (2) the
    # decoder-layer `past_key_value` -> `past_key_values` rename in
    # adapter._cached_step (_PKV_KWARG). The old <5.0 pin's "KV-cached
    # manual generation degenerates under 5.x" was exactly (2): the old
    # kwarg was silently swallowed by **kwargs, the cache was never used,
    # and every decode step saw only its own token. Fixed + verified on
    # 5.14 (Qwen2.5-7B cached introspect/steer streams coherent). Prefer
    # >=5.5: it patches the loader RCEs CVE-2026-4372 + CVE-2026-5241.
    "transformers>=4.40,<6.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]
eval = ["mteb>=1.12", "datasets>=2.14", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/space-bacon/SRT"
Repository = "https://github.com/space-bacon/SRT"
Models = "https://huggingface.co/RiverRider"
Demo = "https://huggingface.co/spaces/RiverRider/srt-adapter-v1.0-demo"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["."]
include = ["srt*", "srt_introspect*", "sunstone_sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download or instantiate real (tiny) HF models",
    "integration: tests that need a GPU or full backbone download",
]
