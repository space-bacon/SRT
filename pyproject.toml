[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srt-adapter"
version = "1.0.0"
description = "Semiotic-Reflexive Transformer — lightweight adapter for semiotic awareness on any frozen causal LM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Burton Lancaster" }]
keywords = ["nlp", "transformers", "adapter", "semiotics", "interpretability", "qwen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6",
    # transformers>=5.0.0rc3 carries the CVE-2026-1839 fix and is verified
    # bit-exact with the SRT manual decoder loop (R0 smoke parity 0.000e+00 on
    # Qwen2 and Qwen3 dense under 5.7.0). The upper bound only excludes the next
    # major; the torch>=2.6 floor additionally neutralises the CVE for anyone
    # who pins back to a 4.x for the validated 235B training runtime.
    "transformers>=5.0.0rc3,<6.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]
eval = ["mteb>=1.12", "datasets>=2.14", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/space-bacon/SRT"
Repository = "https://github.com/space-bacon/SRT"
Models = "https://huggingface.co/RiverRider"
Demo = "https://huggingface.co/spaces/RiverRider/srt-adapter-v1.0-demo"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["."]
include = ["srt*", "srt_introspect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download or instantiate real (tiny) HF models",
]
