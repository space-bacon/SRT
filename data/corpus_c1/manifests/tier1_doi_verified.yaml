# Tier 1 OA papers verified via Crossref + Unpaywall.
# Each PDF URL was returned by Unpaywall as the best OA location and the
# corresponding metadata was confirmed against the citing context.
# Add new entries ONLY after running:
#   python scripts/corpus_c1/doi_lookup.py <doi>
# and confirming title + authors match the intended paper.

manifest_version: 1
author_default: ["various"]
school_default: "tier1-cited-doi"
tier_default: 1
weight_default: 2.0
license_default: "see-per-source"

sources:

  - id: bail_2018_exposure_pnas
    type: europepmc
    pmc_id: "PMC6140520"
    doi: "10.1073/pnas.1804840115"
    author: ["Bail, C. A.", "Argyle, L. P.", "Brown, T. W.", "Bumpus, J. P."]
    year: 2018
    title: "Exposure to opposing views on social media can increase political polarization"
    venue: "PNAS 115(37)"
    license: "pmc-green-oa"
    school: "computational-social-science"

