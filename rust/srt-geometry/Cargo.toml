[package]
name = "srt-geometry"
version = "0.1.0"
edition = "2021"
description = "Read-out geometry for SRT-instrumented frozen models: head projection, per-runtime recalibration, head-space steering, and index search."
license = "Apache-2.0"
repository = "https://github.com/space-bacon/SRT"
readme = "README.md"

[dependencies]
safetensors = "0.4"
half = "2"

[dev-dependencies]
serde_json = "1"

[features]
default = []

[lib]
crate-type = ["cdylib", "rlib"]
